<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MM'EL Radio — Mevunai Moment™ Country Club, Inc ®</title>
  <meta name="theme-color" content="#5c0a18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MM'EL" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="mmel-icon.png" />
  <link rel="apple-touch-icon" href="mmel-icon.png" />
  <style>
    :root {
      --bg-deep: #1e0308;
      --bg-crimson: #4a0714;
      --card-bg: rgba(34, 4, 10, 0.88);
      --gold-bright: #f9e08e;
      --gold-mid: #d4af37;
      --gold-dark: #8a6618;
      --text-main: #fdf6e4;
      --text-muted: #c9ae7e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: radial-gradient(circle at 50% 15%, var(--bg-crimson), var(--bg-deep) 78%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px 28px;
      background-image:
        radial-gradient(circle at 50% 15%, rgba(110, 12, 30, 0.65), rgba(24, 2, 7, 0.96) 80%),
        repeating-linear-gradient(45deg, rgba(212, 175, 55, 0.04) 0px, rgba(212, 175, 55, 0.04) 1px, transparent 1px, transparent 28px);
    }
    .app-shell {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--card-bg);
      border: 1.5px solid var(--gold-mid);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55), inset 0 0 12px rgba(212, 175, 55, 0.15);
    }
    .brand-left { display: flex; align-items: center; gap: 10px; }
    .crest-badge {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid var(--gold-bright);
      overflow: hidden; flex-shrink: 0;
    }
    .crest-badge img { width: 100%; height: 100%; object-fit: cover; }
    .brand-title { font-size: 16px; font-weight: bold; letter-spacing: 1.5px; color: var(--gold-bright); }
    .brand-sub { font-size: 9px; letter-spacing: 1.4px; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }
    .on-air {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 20px;
      border: 1px solid var(--gold-dark);
      background: rgba(92, 10, 24, 0.7);
      font-size: 10px; letter-spacing: 1.2px; color: var(--gold-bright);
      font-family: system-ui, -apple-system, sans-serif; font-weight: 700;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #ff3b5c; box-shadow: 0 0 8px #ff3b5c;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .turntable-card {
      background: var(--card-bg);
      border: 1.5px solid var(--gold-mid);
      border-radius: 20px;
      padding: 22px 16px 20px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(212, 175, 55, 0.12);
    }
    .vinyl-wrap {
      position: relative;
      width: 196px; height: 196px;
      margin: 0 auto 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .vinyl-disc {
      width: 186px; height: 186px; border-radius: 50%;
      background:
        repeating-radial-gradient(circle at center, #140306 0px, #140306 3px, #29070e 4px, #140306 5px);
      border: 2.5px solid var(--gold-mid);
      box-shadow: 0 0 24px rgba(212, 175, 55, 0.25);
      display: flex; align-items: center; justify-content: center;
      animation: spin 9s linear infinite;
      animation-play-state: paused;
    }
    .vinyl-disc.playing { animation-play-state: running; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .vinyl-label {
      width: 74px; height: 74px; border-radius: 50%;
      border: 2px solid var(--gold-bright);
      overflow: hidden;
      box-shadow: 0 0 12px rgba(0,0,0,0.8);
    }
    .vinyl-label img { width: 100%; height: 100%; object-fit: cover; }
    .tonearm {
      position: absolute; top: 6px; right: 12px;
      width: 10px; height: 108px;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold-bright), var(--gold-dark));
      border-radius: 6px;
      transform-origin: top center;
      transform: rotate(-22deg);
      transition: transform 0.5s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    .tonearm.active { transform: rotate(14deg); }
    .tonearm::before {
      content: ''; position: absolute; top: -6px; left: -6px;
      width: 22px; height: 22px; border-radius: 50%;
      background: radial-gradient(circle, var(--gold-bright), var(--gold-dark));
      border: 1.5px solid #2a040b;
    }
    .freq-tag {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 10px; letter-spacing: 2px; color: var(--gold-mid);
      text-transform: uppercase; margin-bottom: 6px;
    }
    .station-name { font-size: 20px; font-weight: bold; color: var(--gold-bright); margin-bottom: 4px; }
    .station-host { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
    .eq-bars {
      display: flex; align-items: flex-end; justify-content: center; gap: 4px;
      height: 22px; margin-bottom: 16px;
    }
    .eq-bar {
      width: 4px; height: 5px; border-radius: 2px;
      background: linear-gradient(to top, var(--gold-dark), var(--gold-bright));
      transition: height 0.15s ease;
    }
    .controls { display: flex; align-items: center; justify-content: center; gap: 20px; }
    .ctrl-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(65, 8, 19, 0.85);
      border: 1.5px solid var(--gold-mid);
      color: var(--gold-bright); font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .play-btn {
      width: 60px; height: 60px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold-mid) 65%, var(--gold-dark));
      border: 2px solid #fff3c4;
      color: #2b040c; font-size: 20px; font-weight: bold; cursor: pointer;
      box-shadow: 0 6px 18px rgba(212, 175, 55, 0.35);
      display: flex; align-items: center; justify-content: center;
    }
    .section-card {
      background: var(--card-bg);
      border: 1.5px solid var(--gold-mid);
      border-radius: 16px;
      padding: 14px;
    }
    .section-title {
      font-size: 12px; letter-spacing: 1.6px; color: var(--gold-bright);
      text-transform: uppercase; margin-bottom: 10px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25); padding-bottom: 6px;
    }
    .channel-list { display: flex; flex-direction: column; gap: 8px; }
    .channel-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 12px;
      background: rgba(58, 7, 17, 0.55);
      border: 1px solid rgba(212, 175, 55, 0.3);
      cursor: pointer; text-align: left; color: var(--text-main);
    }
    .channel-item.active {
      background: rgba(112, 14, 33, 0.85);
      border-color: var(--gold-bright);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.2);
    }
    .ch-name { font-size: 14px; font-weight: bold; color: var(--gold-bright); }
    .ch-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .ch-freq { font-family: system-ui, sans-serif; font-size: 11px; color: var(--gold-mid); font-weight: 700; }
    .stream-row { display: flex; gap: 8px; }
    .stream-input {
      flex: 1; padding: 9px 11px; border-radius: 10px;
      border: 1px solid var(--gold-dark);
      background: rgba(20, 2, 6, 0.9); color: var(--text-main);
      font-size: 12px; outline: none;
    }
    .load-btn {
      padding: 9px 14px; border-radius: 10px;
      background: linear-gradient(135deg, var(--gold-bright), var(--gold-mid));
      border: none; color: #2b040c; font-weight: bold; font-size: 12px; cursor: pointer;
    }
    .trademark {
      text-align: center; font-size: 11px; letter-spacing: 0.8px;
      color: var(--gold-mid); margin-top: 6px; opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="header-bar">
      <div class="brand-left">
        <div class="crest-badge"><img src="mmel-icon.png" alt="MMEL Crest" /></div>
        <div>
          <div class="brand-title">MM'EL RADIO</div>
          <div class="brand-sub">Sovereign Broadcast Network</div>
        </div>
      </div>
      <div class="on-air"><span class="dot"></span> ON AIR</div>
    </div>

    <div class="turntable-card">
      <div class="vinyl-wrap">
        <div class="vinyl-disc" id="vinylDisc">
          <div class="vinyl-label"><img src="mmel-icon.png" alt="MMEL" /></div>
        </div>
        <div class="tonearm" id="tonearm"></div>
      </div>
      <div class="freq-tag" id="freqTag">CH 01 • 104.8 FM SOVEREIGN</div>
      <div class="station-name" id="stationName">Crimson Silk Atrium Lounge</div>
      <div class="station-host" id="stationHost">Hosted by DJ Pharaoh • Live from Flagship</div>
      <div class="eq-bars" id="eqBars"></div>
      <div class="controls">
        <button class="ctrl-btn" onclick="prevStation()" aria-label="Previous">&#9664;&#9664;</button>
        <button class="play-btn" id="playBtn" onclick="togglePlay()" aria-label="Play or Pause">&#9654;</button>
        <button class="ctrl-btn" onclick="nextStation()" aria-label="Next">&#9654;&#9654;</button>
      </div>
    </div>

    <div class="section-card">
      <div class="section-title">Select Broadcast Channel</div>
      <div class="channel-list" id="channelList"></div>
    </div>

    <div class="section-card">
      <div class="section-title">Custom Live Stream / MP3 URL</div>
      <div class="stream-row">
        <input class="stream-input" id="customUrl" type="url" placeholder="Paste .mp3 or live radio stream URL..." />
        <button class="load-btn" onclick="loadCustomStream()">Tune In</button>
      </div>
    </div>

    <div class="trademark">mevunai Moment™ Country Club, Inc ®</div>
  </div>

  <audio id="audioPlayer" crossorigin="anonymous"></audio>

  <script>
    const stations = [
      { freq: "CH 01 • 104.8 FM SOVEREIGN", name: "Crimson Silk Atrium Lounge", host: "Hosted by DJ Pharaoh • Live from Flagship", note: 174.61 },
      { freq: "CH 02 • 98.4 FM AVIATION", name: "Private Jet Midnight", host: "Curated Executive Deep House", note: 196.00 },
      { freq: "CH 03 • 101.2 FM SYNDICATE", name: "Superbike Syndicate", host: "High-Octane Night Drive Mix", note: 220.00 },
      { freq: "CH 04 • 107.9 FM ROYAL", name: "Pharaoh's Velvet Gala", host: "Orchestral & Neo-Soul Ballroom", note: 146.83 }
    ];

    let currentIdx = 0;
    let isPlaying = false;
    let usingCustomUrl = false;
    let audioCtx = null;
    let osc = null;
    let gainNode = null;
    let eqTimer = null;

    const eqContainer = document.getElementById('eqBars');
    for (let i = 0; i < 14; i++) {
      const bar = document.createElement('div');
      bar.className = 'eq-bar';
      eqContainer.appendChild(bar);
    }

    function renderChannels() {
      const list = document.getElementById('channelList');
      list.innerHTML = '';
      stations.forEach((st, idx) => {
        const btn = document.createElement('button');
        btn.className = 'channel-item' + (idx === currentIdx && !usingCustomUrl ? ' active' : '');
        btn.innerHTML = `<div><div class="ch-name">${st.name}</div><div class="ch-desc">${st.host}</div></div><div class="ch-freq">${st.freq.split('•')[1].trim()}</div>`;
        btn.onclick = () => selectStation(idx);
        list.appendChild(btn);
      });
    }

    function startSynth(freq) {
      stopSynth();
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      osc = audioCtx.createOscillator();
      gainNode = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();
    }

    function stopSynth() {
      if (osc) { try { osc.stop(); osc.disconnect(); } catch (e) {} osc = null; }
    }

    function updateUI() {
      const disc = document.getElementById('vinylDisc');
      const arm = document.getElementById('tonearm');
      const btn = document.getElementById('playBtn');
      const bars = document.querySelectorAll('.eq-bar');
      if (isPlaying) {
        disc.classList.add('playing');
        arm.classList.add('active');
        btn.innerHTML = '&#10074;&#10074;';
        clearInterval(eqTimer);
        eqTimer = setInterval(() => {
          bars.forEach(b => { b.style.height = (4 + Math.floor(Math.random() * 18)) + 'px'; });
        }, 160);
      } else {
        disc.classList.remove('playing');
        arm.classList.remove('active');
        btn.innerHTML = '&#9654;';
        clearInterval(eqTimer);
        bars.forEach(b => { b.style.height = '5px'; });
      }
      renderChannels();
    }

    function togglePlay() {
      const player = document.getElementById('audioPlayer');
      if (isPlaying) {
        isPlaying = false;
        player.pause();
        stopSynth();
      } else {
        isPlaying = true;
        if (usingCustomUrl && player.src) {
          player.play().catch(() => {});
        } else {
          startSynth(stations[currentIdx].note);
        }
      }
      updateUI();
    }

    function selectStation(idx) {
      usingCustomUrl = false;
      const player = document.getElementById('audioPlayer');
      player.pause();
      currentIdx = idx;
      const st = stations[currentIdx];
      document.getElementById('freqTag').textContent = st.freq;
      document.getElementById('stationName').textContent = st.name;
      document.getElementById('stationHost').textContent = st.host;
      isPlaying = true;
      startSynth(st.note);
      updateUI();
    }

    function prevStation() { selectStation((currentIdx - 1 + stations.length) % stations.length); }
    function nextStation() { selectStation((currentIdx + 1) % stations.length); }

    function loadCustomStream() {
      const url = document.getElementById('customUrl').value.trim();
      if (!url) return;
      stopSynth();
      usingCustomUrl = true;
      const player = document.getElementById('audioPlayer');
      player.src = url;
      document.getElementById('freqTag').textContent = 'LIVE STREAM • DIRECT FEED';
      document.getElementById('stationName').textContent = 'Custom Sovereign Broadcast';
      document.getElementById('stationHost').textContent = url;
      isPlaying = true;
      player.play().catch(() => {});
      updateUI();
    }

    renderChannels();

    // Register Service Worker for full Android & Desktop App Installation
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b0907" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MMCC Sovereign" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-512.png" />
<link rel="icon" type="image/png" href="icon-512.png" />
<title>Mevunai Moment Country Club — Sovereign v25</title>
<style>
  :root {
    --bg: #0b0907;
    --panel: #14110e;
    --panel-2: #1c1712;
    --gold: #d4af37;
    --gold-light: #f6e08b;
    --gold-dim: rgba(212, 175, 55, 0.25);
    --crimson: #6a0f1d;
    --crimson-glow: #9c162b;
    --text: #f5efe6;
    --muted: #a89b89;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* MOTION INTRO SPLASH */
  #introOverlay {
    position: fixed; inset: 0; z-index: 9999;
    background: radial-gradient(circle at center, #2b070d 0%, #090706 75%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s ease, visibility 0.8s ease;
    overflow: hidden;
  }
  #introOverlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #introVideoPlayer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: none; z-index: 1;
  }
  #particleCanvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
  .pyramid-stage {
    position: relative; z-index: 3; text-align: center; padding: 24px;
    animation: floatUp 1.4s ease-out forwards;
  }
  @keyframes floatUp {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .pyramid-svg {
    width: 170px; height: 170px;
    filter: drop-shadow(0 0 24px rgba(212, 175, 55, 0.55));
    animation: pulseGold 3s infinite ease-in-out;
  }
  @keyframes pulseGold {
    0%, 100% { filter: drop-shadow(0 0 18px rgba(212, 175, 55, 0.45)); }
    50% { filter: drop-shadow(0 0 34px rgba(246, 224, 139, 0.85)); }
  }
  .intro-title {
    margin: 16px 0 6px;
    font-size: 1.35rem; letter-spacing: 0.24em; text-transform: uppercase;
    background: linear-gradient(90deg, #b88a1e, #f6e08b, #d4af37);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    font-weight: 700;
  }
  .intro-sub {
    font-size: 0.78rem; letter-spacing: 0.3em; color: var(--muted); text-transform: uppercase;
  }
  .intro-controls {
    position: absolute; bottom: 32px; z-index: 4; display: flex; gap: 12px;
  }

  /* BUTTONS & HEADER */
  .btn-gold {
    background: linear-gradient(135deg, #c59b27, #f3da78, #b68a1a);
    color: #120d05; border: none; border-radius: 999px;
    padding: 10px 20px; font-weight: 700; font-size: 0.8rem;
    letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
    box-shadow: 0 4px 16px rgba(212, 175, 55, 0.3);
  }
  .btn-outline {
    background: rgba(20, 17, 14, 0.85); color: var(--gold-light);
    border: 1px solid var(--gold-dim); border-radius: 999px;
    padding: 9px 16px; font-size: 0.78rem; letter-spacing: 0.06em;
    text-transform: uppercase; cursor: pointer;
  }
  .btn-outline.active {
    background: var(--crimson); border-color: var(--gold); color: #fff;
  }

  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(11, 9, 7, 0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--gold-dim);
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--gold); }
  .brand-text h1 {
    margin: 0; font-size: 0.95rem; letter-spacing: 0.14em; color: var(--gold-light);
    text-transform: uppercase;
  }
  .brand-text span { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.16em; text-transform: uppercase; }
  .header-actions { display: flex; gap: 8px; }

  /* NAVIGATION TABS */
  nav.tabs {
    display: flex; overflow-x: auto; gap: 8px; padding: 12px 16px;
    border-bottom: 1px solid var(--gold-dim); background: var(--panel);
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    white-space: nowrap; padding: 8px 14px; border-radius: 8px;
    background: transparent; color: var(--muted); border: 1px solid transparent;
    font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  }
  .tab-btn.active {
    color: var(--gold-light); border-color: var(--gold-dim);
    background: linear-gradient(180deg, rgba(212,175,55,0.14), rgba(106,15,29,0.22));
  }

  main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 90px; }
  .section { display: none; }
  .section.active { display: block; }

  /* 13 DEPARTMENTS GRID */
  .grid-13 {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px;
  }
  .dept-card {
    background: linear-gradient(145deg, var(--panel), var(--panel-2));
    border: 1px solid var(--gold-dim); border-radius: 14px; padding: 16px;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .dept-card:hover { transform: translateY(-2px); border-color: var(--gold); }
  .dept-num { font-size: 0.7rem; color: var(--gold); letter-spacing: 0.2em; text-transform: uppercase; }
  .dept-title { margin: 6px 0; font-size: 1.02rem; color: var(--text); }
  .dept-desc { margin: 0 0 12px; font-size: 0.82rem; color: var(--muted); line-height: 1.45; }
  .dept-status {
    display: inline-block; font-size: 0.68rem; padding: 3px 9px; border-radius: 999px;
    background: rgba(212, 175, 55, 0.12); color: var(--gold-light); border: 1px solid var(--gold-dim);
  }

  /* VALET & JET GARAGE */
  .panel-box {
    background: var(--panel); border: 1px solid var(--gold-dim);
    border-radius: 14px; padding: 18px; margin-bottom: 18px;
  }
  .form-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px;
  }
  input, select {
    width: 100%; background: #0e0c09; color: var(--text);
    border: 1px solid var(--gold-dim); border-radius: 8px; padding: 10px 12px; font-size: 0.88rem;
  }
  .fleet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .fleet-card {
    background: var(--panel-2); border: 1px solid var(--gold-dim); border-radius: 12px; overflow: hidden;
  }
  .fleet-card img { width: 100%; height: 145px; object-fit: cover; background: #090806; display: block; }
  .fleet-body { padding: 12px; }

  /* VIP CARD STUDIO */
  .vip-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; align-items: center; }
  #vipCanvas {
    width: 100%; max-width: 460px; border-radius: 16px;
    border: 1px solid var(--gold); box-shadow: 0 12px 32px rgba(0,0,0,0.7);
    display: block; margin: 0 auto;
  }

  /* SLIDE-OUT VIDEO VAULT DRAWER */
  #vaultDrawer {
    position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100vh;
    background: #110e0b; border-left: 1px solid var(--gold);
    z-index: 200; transition: right 0.35s ease; display: flex; flex-direction: column;
    box-shadow: -12px 0 40px rgba(0,0,0,0.85);
  }
  #vaultDrawer.open { right: 0; }
  .vault-header {
    padding: 16px; border-bottom: 1px solid var(--gold-dim);
    display: flex; justify-content: space-between; align-items: center;
  }
  .vault-body { padding: 16px; overflow-y: auto; flex: 1; }
  #vaultPlayer {
    width: 100%; border-radius: 10px; background: #000;
    border: 1px solid var(--gold-dim); max-height: 220px;
  }
  .vault-toggles { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .clip-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px; border: 1px solid var(--gold-dim); border-radius: 8px;
    margin-bottom: 8px; background: var(--panel-2); cursor: pointer; font-size: 0.82rem;
  }
  .clip-item.playing { border-color: var(--gold); background: rgba(106,15,29,0.35); }
</style>
</head>
<body>

<!-- 24K GOLD PYRAMID & CRIMSON SILK MOTION INTRO -->
<div id="introOverlay">
  <video id="introVideoPlayer" playsinline muted></video>
  <canvas id="particleCanvas"></canvas>
  <div class="pyramid-stage" id="defaultPyramidCrest">
    <svg class="pyramid-svg" viewBox="0 0 200 200" fill="none">
      <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f6e08b"/>
          <stop offset="50%" stop-color="#d4af37"/>
          <stop offset="100%" stop-color="#8f6b14"/>
        </linearGradient>
      </defs>
      <circle cx="100" cy="100" r="92" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <polygon points="100,24 172,154 28,154" stroke="url(#goldGrad)" stroke-width="3" fill="rgba(212,175,55,0.08)"/>
      <polygon points="100,52 146,138 54,138" stroke="url(#goldGrad)" stroke-width="1.5" fill="rgba(106,15,29,0.35)"/>
      <ellipse cx="100" cy="106" rx="22" ry="11" stroke="#f6e08b" stroke-width="2"/>
      <circle cx="100" cy="106" r="5" fill="#f6e08b"/>
    </svg>
    <div class="intro-title">Mevunai Moment</div>
    <div class="intro-sub">Sovereign Country Club • v25</div>
  </div>
  <div class="intro-controls">
    <button class="btn-gold" onclick="closeIntro()">Enter Sovereign Suite</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="brand">
    <img src="icon-512.png" alt="MMCC Crest" />
    <div class="brand-text">
      <h1>Mevunai Moment</h1>
      <span>Sovereign Suite v25</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-outline" onclick="replayIntro()">Intro</button>
    <button class="btn-gold" onclick="toggleVault(true)">Video Vault</button>
  </div>
</header>

<!-- TABS -->
<nav class="tabs">
  <button class="tab-btn active" onclick="switchTab('departments', this)">13 Departments</button>
  <button class="tab-btn" onclick="switchTab('garage', this)">Valet &amp; Jet Garage</button>
  <button class="tab-btn" onclick="switchTab('vip', this)">VIP Card Studio</button>
</nav>

<main>
  <!-- TAB 1: 13 SOVEREIGN DEPARTMENTS -->
  <section id="departments" class="section active">
    <div class="grid-13" id="deptGrid"></div>
  </section>

  <!-- TAB 2: VALET & JET GARAGE -->
  <section id="garage" class="section">
    <div class="panel-box">
      <h3 style="margin-top:0;color:var(--gold-light);">Register Fleet Asset (Offline Storage)</h3>
      <div class="form-row">
        <select id="assetType">
          <option value="Private Jet">Private Jet / Aviation</option>
          <option value="Superyacht">Superyacht / Marina</option>
          <option value="Exotic Valet">Exotic / Chauffeur Fleet</option>
        </select>
        <input type="text" id="assetModel" placeholder="Model (e.g., Gulfstream G700)" />
        <input type="text" id="assetTail" placeholder="Tail / Plate ID (e.g., 4X-MMCC)" />
      </div>
      <div class="form-row">
        <input type="file" id="assetPhoto" accept="image/*" />
        <button class="btn-gold" onclick="addFleetAsset()">Add to Sovereign Garage</button>
      </div>
    </div>
    <div class="fleet-grid" id="fleetGrid"></div>
  </section>

  <!-- TAB 3: CUSTOM VIP CARD STUDIO -->
  <section id="vip" class="section">
    <div class="panel-box vip-layout">
      <div>
        <h3 style="margin-top:0;color:var(--gold-light);">24K Sovereign VIP Card Studio</h3>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <input type="text" id="vipName" value="FOUNDER MEMBER" oninput="drawVipCard()" placeholder="Member Name" />
          <input type="text" id="vipTitle" value="SOVEREIGN ALL-ACCESS" oninput="drawVipCard()" placeholder="Tier / Title" />
          <input type="text" id="vipNumber" value="MMCC • 0001 • 24K" oninput="drawVipCard()" placeholder="Card Serial" />
          <select id="vipTheme" onchange="drawVipCard()">
            <option value="obsidian">24K Gold on Obsidian</option>
            <option value="crimson">Imperial Crimson &amp; Gold</option>
            <option value="emerald">Emerald Velvet &amp; Gold</option>
          </select>
          <button class="btn-gold" onclick="downloadVipCard()">Export 24K VIP Card (.PNG)</button>
        </div>
      </div>
      <div>
        <canvas id="vipCanvas" width="860" height="540"></canvas>
      </div>
    </div>
  </section>
</main>

<!-- SLIDE-OUT OFFLINE VIDEO VAULT -->
<aside id="vaultDrawer">
  <div class="vault-header">
    <strong style="color:var(--gold-light);letter-spacing:0.12em;text-transform:uppercase;">Slide-Out Video Vault</strong>
    <button class="btn-outline" onclick="toggleVault(false)">Close</button>
  </div>
  <div class="vault-body">
    <video id="vaultPlayer" controls playsinline></video>
    <div class="vault-toggles">
      <button id="btnLoop" class="btn-outline active" onclick="toggleVaultOption('loop')">Loop: ON</button>
      <button id="btnMute" class="btn-outline" onclick="toggleVaultOption('mute')">Mute: OFF</button>
      <button id="btnAuto" class="btn-outline active" onclick="toggleVaultOption('auto')">Auto-Advance: ON</button>
    </div>
    <div style="margin-bottom:14px;">
      <button class="btn-gold" style="width:100%;" onclick="setActiveAsIntro()">Set Active Clip as App Intro</button>
    </div>
    <div style="margin-bottom:14px;">
      <label style="display:block;font-size:0.75rem;color:var(--muted);margin-bottom:6px;">Upload Local .MP4 Clips</label>
      <input type="file" id="vaultUpload" accept="video/mp4,video/*" multiple onchange="handleVaultFiles(event)" />
    </div>
    <div id="vaultPlaylist"></div>
  </div>
</aside>

<script>
// 1. SERVICE WORKER REGISTRATION
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// 2. 13 SOVEREIGN DEPARTMENTS DATA
const DEPARTMENTS = [
  { num: "Dept 01", name: "Flagship Couture & Atelier", desc: "Bespoke tailoring, emerald velvet embroidery & private fittings.", status: "Private Salon Open" },
  { num: "Dept 02", name: "Aviation & Marina", desc: "Private jet tarmac clearance, helipad & superyacht berth concierge.", status: "24/7 Dispatch" },
  { num: "Dept 03", name: "Royal Cigar & Spirits Lounge", desc: "Rare single malts, vintage humidor & acoustic velvet lounge.", status: "Members Only" },
  { num: "Dept 04", name: "Private Cinema", desc: "4K laser screening room with reclining bullion-leather seating.", status: "Screening Ready" },
  { num: "Dept 05", name: "Royal Spa & Thermal Bathhouse", desc: "Cedar hammam, mineral plunge pools & restorative therapies.", status: "Open Until 23:00" },
  { num: "Dept 06", name: "Kinetic Performance Gym", desc: "Biometric strength lab, recovery cryotherapy & personal coaching.", status: "Active" },
  { num: "Dept 07", name: "Medical & Longevity Centre", desc: "Preventive diagnostics, IV infusions & executive wellness.", status: "By Appointment" },
  { num: "Dept 08", name: "Sovereign Fine Dining", desc: "Chef's tasting table, cellar pairings & terrace service.", status: "Dinner Service" },
  { num: "Dept 09", name: "Championship Golf & Padel", desc: "18-hole manicured links, floodlit padel courts & pro shop.", status: "Tee Times Open" },
  { num: "Dept 10", name: "Sovereign Vault & Horology", desc: "High-security bullion custody & rare timepiece gallery.", status: "Biometric Access" },
  { num: "Dept 11", name: "Equestrian & Polo Grounds", desc: "Private stables, dressage arena & weekend polo pavilion.", status: "Active" },
  { num: "Dept 12", name: "MMEL Radio & Sound Studio", desc: "Curated club broadcasts, mastering suite & vinyl archive.", status: "On Air" },
  { num: "Dept 13", name: "Valet & Sovereign Concierge", desc: "Chauffeur dispatch, diplomatic protocol & global lifestyle desk.", status: "Standing By" }
];

document.getElementById('deptGrid').innerHTML = DEPARTMENTS.map(d => `
  <div class="dept-card">
    <div class="dept-num">${d.num}</div>
    <h3 class="dept-title">${d.name}</h3>
    <p class="dept-desc">${d.desc}</p>
    <span class="dept-status">${d.status}</span>
  </div>
`).join('');

// 3. TABS
function switchTab(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

// 4. GOLD PARTICLES & INTRO LOGIC
const pCanvas = document.getElementById('particleCanvas');
const pCtx = pCanvas.getContext('2d');
let particles = [];
function resizeParticles() {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeParticles);
resizeParticles();
for (let i = 0; i < 48; i++) {
  particles.push({
    x: Math.random() * pCanvas.width,
    y: Math.random() * pCanvas.height,
    r: Math.random() * 2.2 + 0.6,
    vy: -(Math.random() * 0.6 + 0.2),
    alpha: Math.random()
  });
}
function animateParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  particles.forEach(p => {
    p.y += p.vy;
    if (p.y < 0) p.y = pCanvas.height;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    pCtx.fillStyle = `rgba(246, 224, 139, ${p.alpha})`;
    pCtx.fill();
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

let customIntroUrl = null;
function closeIntro() {
  document.getElementById('introOverlay').classList.add('hidden');
  const iv = document.getElementById('introVideoPlayer');
  iv.pause();
}
function replayIntro() {
  const overlay = document.getElementById('introOverlay');
  const iv = document.getElementById('introVideoPlayer');
  const crest = document.getElementById('defaultPyramidCrest');
  overlay.classList.remove('hidden');
  if (customIntroUrl) {
    iv.src = customIntroUrl;
    iv.style.display = 'block';
    crest.style.display = 'none';
    iv.play().catch(() => {});
  } else {
    iv.style.display = 'none';
    crest.style.display = 'block';
  }
}

// 5. SLIDE-OUT VIDEO VAULT
let vaultClips = [];
let activeClipIdx = -1;
let vaultOpts = { loop: true, mute: false, auto: true };
const vaultPlayer = document.getElementById('vaultPlayer');
vaultPlayer.loop = true;

function toggleVault(open) {
  document.getElementById('vaultDrawer').classList.toggle('open', open);
}
function toggleVaultOption(key) {
  vaultOpts[key] = !vaultOpts[key];
  if (key === 'loop') {
    vaultPlayer.loop = vaultOpts.loop;
    const b = document.getElementById('btnLoop');
    b.textContent = `Loop: ${vaultOpts.loop ? 'ON' : 'OFF'}`;
    b.classList.toggle('active', vaultOpts.loop);
  } else if (key === 'mute') {
    vaultPlayer.muted = vaultOpts.mute;
    const b = document.getElementById('btnMute');
    b.textContent = `Mute: ${vaultOpts.mute ? 'ON' : 'OFF'}`;
    b.classList.toggle('active', vaultOpts.mute);
  } else if (key === 'auto') {
    const b = document.getElementById('btnAuto');
    b.textContent = `Auto-Advance: ${vaultOpts.auto ? 'ON' : 'OFF'}`;
    b.classList.toggle('active', vaultOpts.auto);
  }
}
vaultPlayer.addEventListener('ended', () => {
  if (!vaultOpts.loop && vaultOpts.auto && vaultClips.length > 0) {
    playVaultClip((activeClipIdx + 1) % vaultClips.length);
  }
});
function handleVaultFiles(e) {
  const files = Array.from(e.target.files);
  files.forEach(f => {
    vaultClips.push({ name: f.name, url: URL.createObjectURL(f) });
  });
  renderVaultList();
  if (activeClipIdx === -1 && vaultClips.length > 0) playVaultClip(0);
}
function renderVaultList() {
  document.getElementById('vaultPlaylist').innerHTML = vaultClips.map((c, idx) => `
    <div class="clip-item ${idx === activeClipIdx ? 'playing' : ''}" onclick="playVaultClip(${idx})">
      <span>${idx + 1}. ${c.name}</span>
      <span style="color:var(--gold);">${idx === activeClipIdx ? 'ACTIVE' : 'PLAY'}</span>
    </div>
  `).join('');
}
function playVaultClip(idx) {
  activeClipIdx = idx;
  vaultPlayer.src = vaultClips[idx].url;
  vaultPlayer.play().catch(() => {});
  renderVaultList();
}
function setActiveAsIntro() {
  if (activeClipIdx < 0 || !vaultClips[activeClipIdx]) {
    alert('Upload and select a video clip in the Vault first.');
    return;
  }
  customIntroUrl = vaultClips[activeClipIdx].url;
  alert(`"${vaultClips[activeClipIdx].name}" set as custom App Intro! Tap "Intro" in the header to preview.`);
}

// 6. VALET & JET GARAGE (LOCALSTORAGE)
let fleetList = JSON.parse(localStorage.getItem('mmcc_fleet_v25') || '[]');
function renderFleet() {
  const grid = document.getElementById('fleetGrid');
  if (fleetList.length === 0) {
    grid.innerHTML = '<p style="color:var(--muted);">No fleet assets registered yet. Add your jet, yacht, or vehicle above.</p>';
    return;
  }
  grid.innerHTML = fleetList.map((item, i) => `
    <div class="fleet-card">
      ${item.img ? `<img src="${item.img}" alt="${item.model}" />` : ''}
      <div class="fleet-body">
        <div class="dept-num">${item.type}</div>
        <h4 style="margin:4px 0;color:var(--text);">${item.model}</h4>
        <div style="font-size:0.8rem;color:var(--gold-light);margin-bottom:10px;">ID: ${item.tail}</div>
        <button class="btn-outline" onclick="removeFleet(${i})">Remove</button>
      </div>
    </div>
  `).join('');
}
function addFleetAsset() {
  const type = document.getElementById('assetType').value;
  const model = document.getElementById('assetModel').value.trim() || 'Sovereign Asset';
  const tail = document.getElementById('assetTail').value.trim() || 'MMCC-VIP';
  const file = document.getElementById('assetPhoto').files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = () => {
      fleetList.unshift({ type, model, tail, img: reader.result });
      localStorage.setItem('mmcc_fleet_v25', JSON.stringify(fleetList));
      renderFleet();
    };
    reader.readAsDataURL(file);
  } else {
    fleetList.unshift({ type, model, tail, img: '' });
    localStorage.setItem('mmcc_fleet_v25', JSON.stringify(fleetList));
    renderFleet();
  }
}
function removeFleet(i) {
  fleetList.splice(i, 1);
  localStorage.setItem('mmcc_fleet_v25', JSON.stringify(fleetList));
  renderFleet();
}
renderFleet();

// 7. VIP CARD STUDIO CANVAS
function drawVipCard() {
  const canvas = document.getElementById('vipCanvas');
  const ctx = canvas.getContext('2d');
  const name = document.getElementById('vipName').value.toUpperCase();
  const title = document.getElementById('vipTitle').value.toUpperCase();
  const serial = document.getElementById('vipNumber').value.toUpperCase();
  const theme = document.getElementById('vipTheme').value;

  const grad = ctx.createLinearGradient(0, 0, 860, 540);
  if (theme === 'crimson') {
    grad.addColorStop(0, '#3d0710'); grad.addColorStop(1, '#120608');
  } else if (theme === 'emerald') {
    grad.addColorStop(0, '#072b1e'); grad.addColorStop(1, '#06120d');
  } else {
    grad.addColorStop(0, '#1e1913'); grad.addColorStop(1, '#090806');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 860, 540);

  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = 6;
  ctx.strokeRect(22, 22, 816, 496);

  ctx.fillStyle = '#f6e08b';
  ctx.font = 'bold 26px Georgia, serif';
  ctx.fillText('MEVUNAI MOMENT COUNTRY CLUB', 56, 86);

  ctx.fillStyle = '#d4af37';
  ctx.font = '18px sans-serif';
  ctx.fillText(title, 56, 122);

  // Pyramid emblem
  ctx.beginPath();
  ctx.moveTo(740, 66); ctx.lineTo(790, 146); ctx.lineTo(690, 146); ctx.closePath();
  ctx.strokeStyle = '#f6e08b'; ctx.lineWidth = 3; ctx.stroke();

  ctx.fillStyle = '#f5efe6';
  ctx.font = 'bold 38px Georgia, serif';
  ctx.fillText(name, 56, 390);

  ctx.fillStyle = '#d4af37';
  ctx.font = '22px monospace';
  ctx.fillText(serial, 56, 450);
}
function downloadVipCard() {
  const link = document.createElement('a');
  link.download = 'MMCC-Sovereign-VIP-Card.png';
  link.href = document.getElementById('vipCanvas').toDataURL('image/png');
  link.click();
}
drawVipCard();
